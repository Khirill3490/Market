<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Товар — Мой Магазин</title>
    <style>
        :root { --bg:#f6f7f9; --card:#fff; --text:#1f2937; --muted:#6b7280;
            --primary:#2563eb; --primary-hover:#1d4ed8; --ok:#22c55e; --danger:#ef4444; --border:#e5e7eb; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
        a { text-decoration:none; color:inherit; }
        header { background:#0f172a; color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
        .brand { display:flex; gap:10px; font-weight:700; }
        .brand .logo { width:28px;height:28px;background:#22c55e;display:grid;place-items:center;border-radius:8px; }
        nav { display:flex; gap:14px; align-items:center; }
        .btn { border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600; }
        .btn-outline { background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3); }
        .btn-outline:hover { border-color:#fff; }
        .container { max-width:1180px; margin:20px auto; padding:20px; }

        /* Страница товара */
        .product-page { display:grid; grid-template-columns: 1fr 1fr; gap:24px; background:var(--card); padding:20px; border-radius:14px; box-shadow:0 8px 20px rgba(0,0,0,.06);}
        .product-page img { width:100%; border-radius:10px; object-fit:cover; background:#f1f5f9; }
        .product-info h1 { margin-top:0; font-size:24px; }
        .product-info p { margin:10px 0; line-height:1.4; }
        .muted { color:var(--muted); }
        .actions { margin-top:20px; display:flex; gap:12px; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:var(--primary-hover); }
        footer { color:var(--muted); font-size:14px; text-align:center; padding:26px 10px; }
    </style>
</head>
<body>
<header>
    <div class="brand"><div class="logo">🛒</div><a href="/" class="title">Мой Магазин</a></div>
    <nav id="guest-nav">
        <a href="/login" class="muted">Войти</a>
        <a href="/register" class="muted">Регистрация</a>
    </nav>
    <nav id="account-nav" style="display:none">
        <a href="/catalog">Каталог</a>
        <a href="/account" id="username"></a>
        <button class="btn btn-outline" id="logoutBtn">Выйти</button>
    </nav>
</header>

<div class="container">
    <div id="product" class="product-page">
        <p>Загружаем товар...</p>
    </div>
</div>

<footer>
    <nav>
        <a href="/catalog">Каталог</a> ·
        <a href="/about">О нас</a> ·
        <a href="/contacts">Контакты</a> ·
        <a href="/sales">Акции</a> ·
        <a href="https://t.me/yourtelegram" target="_blank">Наш Telegram</a>
    </nav>
</footer>

<script>
    // === JWT логика ===
    const TOKEN_KEY = "accessToken";
    const META_KEY  = "authMeta";

    function loadAuth() {
        const token = sessionStorage.getItem(TOKEN_KEY);
        const meta  = JSON.parse(sessionStorage.getItem(META_KEY) || "{}");
        return { token, meta };
    }

    function showAuthState() {
        const { token, meta } = loadAuth();
        if (token) {
            document.getElementById("guest-nav").style.display = "none";
            document.getElementById("account-nav").style.display = "flex";
            document.getElementById("username").textContent = meta.email || "Профиль";
        }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
        sessionStorage.clear();
        location.reload();
    });

    showAuthState();

    // === Загрузка товара ===
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const productEl = document.getElementById("product");

        if (!id) {
            productEl.innerHTML = "<p>❌ Ошибка: id товара не указан.</p>";
            return;
        }

        try {
            const resp = await fetch(`/api/v1/products/${id}`);
            if (!resp.ok) {
                productEl.innerHTML = `<p>❌ Ошибка загрузки товара (HTTP ${resp.status})</p>`;
                return;
            }
            const p = await resp.json();

            productEl.innerHTML = `
        <img src="${p.img || '/placeholder.png'}" alt="${p.name}">
        <div class="product-info">
          <h1>${p.name}</h1>
          <p class="muted">${p.brand || ''} · ${p.cat || ''}</p>
          <p>${p.inf || ''}</p>
          <p>${p.ext || ''}</p>
          <p><b>Артикул:</b> ${p.art || '-'}</p>
          <p><b>Штрихкод:</b> ${p.bar || '-'}</p>
          <p><b>Ед. изм.:</b> ${p.unit || '-'} ${p.sml || ''}</p>
          <div class="actions">
            <button class="btn btn-primary">Добавить в корзину</button>
          </div>
        </div>
      `;
        } catch (e) {
            productEl.innerHTML = "<p>❌ Ошибка соединения с сервером.</p>";
        }
    })();
</script>
</body>
</html>
