<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Главная — Мой Магазин</title>
    <style>
        :root { --bg:#f6f7f9; --card:#fff; --text:#1f2937; --muted:#6b7280;
            --primary:#2563eb; --primary-hover:#1d4ed8; --ok:#22c55e; --danger:#ef4444;
            --border:#e5e7eb; --shadow:0 8px 20px rgba(0,0,0,.06); }
        * { box-sizing:border-box; }
        body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
        a { text-decoration:none; color:inherit; }
        .muted{ color:var(--muted); }

        header { background:#0f172a; color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; }
        .brand { display:flex; gap:10px; font-weight:700; align-items:center; }
        .brand .logo { width:28px;height:28px;background:#22c55e;display:grid;place-items:center;border-radius:8px; }
        nav { display:flex; gap:14px; align-items:center; }
        .btn { border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600; }
        .btn-outline { background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3); }
        .btn-outline:hover { border-color:#fff; }
        .btn-primary{ background:var(--primary); color:#fff; }
        .btn-primary:hover{ background:var(--primary-hover); }

        .container { max-width:1180px; margin:20px auto; padding:0 18px 18px; }

        .search { display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:12px; margin:16px 0; }
        .search input[type="search"]{ flex:1; min-width:0; padding:12px 14px; border:1px solid var(--border); border-radius:10px; font-size:15px; }

        .cats { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin:10px 0 18px; }
        .cat { display:flex; align-items:center; justify-content:center; text-align:center; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; cursor:pointer; transition:transform .06s ease, box-shadow .06s ease; }
        .cat:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }

        .section-title{ margin:12px 0; }
        .grid { display:grid; gap:16px; grid-template-columns:repeat(4,1fr); }

        /* Карточка товара */
        .product { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column;
            transition: transform .06s ease, box-shadow .06s ease; cursor: pointer; }
        .product:hover{ transform: translateY(-2px); box-shadow: var(--shadow); }
        .product img { width:100%; aspect-ratio:4/3; object-fit:cover; background:#f1f5f9; }
        .product .body { padding:12px; display:flex; flex-direction:column; gap:8px; }
        .product h4 { margin:0; font-size:16px; line-height:1.25; }

        /* Важно: <a class="product"> ведёт себя как карточка */
        a.product { display:flex; flex-direction:column; }

        .toast{ position:fixed; right:16px; bottom:16px; background:#111827; color:#fff; padding:12px 14px; border-radius:10px; box-shadow:0 10px 24px rgba(0,0,0,.2); display:none; gap:10px; align-items:center; z-index:20; }
        .toast.show{ display:flex; }

        footer{ background:#0f172a; color:#e5e7eb; margin-top:24px; }
        .footer-inner{ max-width:1180px; margin:0 auto; padding:18px; display:flex; gap:18px; flex-wrap:wrap; align-items:center; justify-content:center; }
        .footer-inner a{ color:#e5e7eb; }

        @media (max-width:1080px){ .grid{ grid-template-columns:repeat(3,1fr) } .cats{ grid-template-columns:repeat(3,1fr) } }
        @media (max-width:760px){ .grid{ grid-template-columns:repeat(2,1fr) } .cats{ grid-template-columns:repeat(2,1fr) } }
    </style>
</head>
<body>
<header>
    <div class="brand"><div class="logo">🛒</div><a href="/" class="title">Мой Магазин</a></div>
    <nav id="guest-nav">
        <a href="/catalog" class="muted">Каталог</a>
        <a href="/login" class="muted">Войти</a>
        <a href="/register" class="muted">Регистрация</a>
    </nav>
    <nav id="user-nav" style="display:none">
        <a href="/catalog">Каталог</a>
        <a href="/account" id="username"></a>
        <button class="btn btn-outline" id="logoutBtn" type="button">Выйти</button>
    </nav>
</header>

<div class="container">
    <div class="search">
        <input id="q" type="search" placeholder="Поиск по товарам…" aria-label="Поиск по товарам"/>
        <button id="searchBtn" class="btn btn-primary" type="button">Найти</button>
    </div>

    <div id="cats" class="cats"></div>

    <h3 class="section-title">Случайные товары</h3>
    <div id="products" class="grid"></div>
</div>

<footer>
    <div class="footer-inner">
        <a href="/catalog">Каталог</a>
        <a href="/about">О нас</a>
        <a href="/contacts">Контакты</a>
        <a href="/deals">Акции</a>
        <a href="https://t.me/your_channel" target="_blank" rel="noopener">Наш телеграм</a>
    </div>
</footer>

<div class="toast" id="toast"><span id="toastMsg">Текст</span><button id="toastClose" class="btn" type="button">OK</button></div>

<script>
    /* JWT как раньше */
    const TOKEN_KEY = "accessToken"; const META_KEY="authMeta";
    function loadAuth(){ const token=sessionStorage.getItem(TOKEN_KEY); const meta=JSON.parse(sessionStorage.getItem(META_KEY)||"{}"); return {token,meta}; }
    function showAuthState(){ const {token,meta}=loadAuth(); if(token){ document.getElementById("guest-nav").style.display="none"; document.getElementById("user-nav").style.display="flex"; document.getElementById("username").textContent=meta.email||"Профиль"; } }
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) logoutBtn.addEventListener("click",()=>{ sessionStorage.clear(); location.reload(); });
    showAuthState();

    /* helpers */
    const $=s=>document.querySelector(s);
    const toast=(m)=>{ const t=$('#toast'); $('#toastMsg').textContent=m; t.classList.add('show'); const close=()=>t.classList.remove('show'); $('#toastClose').onclick=close; setTimeout(close,3500); };
    const escapeHtml = (s='') => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function parseJsonSafe(res){ try{return await res.json();}catch{return null;} }

    /* Поиск — кнопка и Enter */
    const q = document.getElementById('q');
    const goSearch = () => {
        const term = (q.value || '').trim();
        if (term) location.assign(`/catalog?q=${encodeURIComponent(term)}`);
    };
    document.getElementById('searchBtn').addEventListener('click', goSearch);
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter') goSearch(); });

    /* Категории (кликабельные) */
    async function loadCategories(){
        const box=$('#cats');
        try{
            const res=await fetch('/api/v1/products/categories/random',{credentials:'include'});
            if(!res.ok) throw 0;
            const data=await parseJsonSafe(res);
            const items=Array.isArray(data)?data:[];
            if(!items.length){ box.innerHTML="<div class='muted'>Нет категорий</div>"; return; }
            box.innerHTML=items.slice(0,6).map(c=>{
                const name = escapeHtml(c.name||'Категория');
                const slug = c?.slug ?? c?.id ?? name;
                const href = `/catalog?cat=${encodeURIComponent(String(slug))}`;
                return `<a class="cat" href="${href}">${name}</a>`;
            }).join('');
        }catch{ box.innerHTML="<div class='muted'>Категории недоступны</div>"; }
    }

    /* Карточка товара — ссылка с id/slug */
    function card(p){
        const title = escapeHtml(p?.name || 'Товар');
        const img   = p?.img || 'https://via.placeholder.com/600x400?text=No+Image';
        const idOrSlug = (p?.slug ?? p?.id ?? null);
        if (!idOrSlug) {
            return `
        <div class="product" style="opacity:.7;cursor:default">
          <img src="${img}" alt="${title}" loading="lazy">
          <div class="body"><h4>${title}</h4></div>
        </div>`;
        }
        const href = `/product?pid=${encodeURIComponent(String(idOrSlug))}`;
        return `
      <a href="${href}" class="product">
        <img src="${img}" alt="${title}" loading="lazy">
        <div class="body"><h4>${title}</h4></div>
      </a>`;
    }

    /* Загрузка товаров */
    async function loadProducts(){
        const grid = $('#products');
        grid.innerHTML = "<div class='muted'>Загружаем товары…</div>";
        try {
            const res = await fetch('/api/v1/products/random', { credentials:'include' });
            if (!res.ok) throw 0;
            const data = await parseJsonSafe(res);
            const items = Array.isArray(data) ? data : [];
            if (!items.length) {
                grid.innerHTML = "<div class='muted'>Нет товаров</div>";
                return;
            }
            grid.innerHTML = items.slice(0,12).map(card).join('');
        } catch {
            grid.innerHTML = "<div class='muted'>Не удалось загрузить товары</div>";
        }
    }

    /* Делегированный клик — на случай перекрытий или вложенных элементов */
    document.getElementById('products').addEventListener('click', (e) => {
        const cardEl = e.target.closest('.product');
        if (!cardEl) return;
        const href = cardEl.tagName === 'A' && cardEl.getAttribute('href') ? cardEl.getAttribute('href') : null;
        if (!href) return;
        e.preventDefault();
        window.location.assign(href);
    });

    (async function init(){ await loadCategories(); await loadProducts(); })();
</script>
</body>
</html>
