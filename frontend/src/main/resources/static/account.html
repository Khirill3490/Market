<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Профиль — Мой Магазин</title>
    <style>
        :root { --bg:#f6f7f9; --card:#fff; --text:#1f2937; --muted:#6b7280;
            --primary:#2563eb; --primary-hover:#1d4ed8; --ok:#22c55e; --danger:#ef4444; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--text); background:var(--bg); }
        a { color:inherit; text-decoration: none; }
        header { background:#0f172a; color:#fff; padding:14px 18px; position:sticky; top:0; z-index:50;
            display:flex; gap:16px; align-items:center; justify-content:space-between; }
        .brand { display:flex; align-items:center; gap:10px; font-weight:700; }
        .brand .logo { width:28px; height:28px; background:#22c55e; display:grid; place-items:center; border-radius:8px; font-size:16px; }
        nav { display:flex; align-items:center; gap:14px; }
        nav .muted { opacity:.9 }
        nav .btn { border:0; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:600; }
        nav .btn-outline { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.3); }
        nav .btn-outline:hover { border-color:#fff; }
        nav .btn-primary { background:var(--primary); color:#fff; }
        nav .btn-primary:hover { background:var(--primary-hover); }
        .container { max-width:920px; margin:0 auto; padding:18px; }

        .card { background:var(--card); border:1px solid #e5e7eb; border-radius:16px; padding:18px; box-shadow:0 8px 20px rgba(0,0,0,0.06); }
        .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
        .row { display:flex; gap:12px; align-items:center; }
        .label { width:180px; color:var(--muted); }
        .value { font-weight:600; }
        .muted { color:var(--muted); }

        .avatar { width:72px; height:72px; border-radius:12px; background:#e5e7eb; display:grid; place-items:center; font-size:28px; font-weight:700; }
        .actions { display:flex; gap:10px; flex-wrap:wrap; }

        .btn { border:0; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:700; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:var(--primary-hover); }
        .btn-outline-dark { background:#fff; border:1px solid #e5e7eb; }
        .btn-danger { background:var(--danger); color:#fff; }

        footer { color:var(--muted); font-size:14px; text-align:center; padding:26px 10px; }

        /* тост */
        .toast { position: fixed; right:16px; bottom:16px; background:#111827; color:#fff;
            padding:12px 14px; border-radius:10px; box-shadow:0 10px 24px rgba(0,0,0,.2); display:none; gap:10px; align-items:center; }
        .toast.show { display:flex; }
        /* скелетоны */
        .skeleton { background: linear-gradient(90deg, #eee 25%, #f5f5f5 37%, #eee 63%); background-size: 400% 100%; animation: shine 1.2s infinite; border-radius:8px; }
        @keyframes shine { 0% {background-position: 100% 0;} 100% {background-position: 0 0;} }
    </style>
</head>
<body>
<header>
    <div class="brand">
        <div class="logo">🛒</div>
        <a href="/" class="title">Мой Магазин</a>
    </div>
    <nav id="nav-public">
        <a class="muted" href="/catalog">Каталог</a>
        <a class="muted" href="/login">Войти</a>
        <a class="btn btn-primary" href="/register">Регистрация</a>
    </nav>
    <nav id="nav-auth" style="display:none">
        <a class="muted" href="/catalog">Каталог</a>
        <a class="muted" href="/cart">Корзина</a>
        <a class="btn btn-outline" id="userBtn" href="/account">username</a>
        <button class="btn btn-outline" id="logoutBtn">Выйти</button>
    </nav>
</header>

<div class="container">
    <h2 style="margin:14px 0;">Профиль</h2>

    <div id="profileCard" class="card" aria-live="polite">
        <!-- скелетон до загрузки -->
        <div class="row" style="margin-bottom:14px;">
            <div class="avatar skeleton" style="width:72px;height:72px;"></div>
            <div>
                <div class="skeleton" style="width:220px;height:18px;margin:6px 0;"></div>
                <div class="skeleton" style="width:180px;height:14px;"></div>
            </div>
        </div>
        <div class="grid-2">
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
            <div class="skeleton" style="height:16px;"></div>
        </div>
        <div class="actions" style="margin-top:16px;">
            <button class="btn btn-primary" id="editBtn" disabled>Редактировать</button>
            <a class="btn btn-outline-dark" href="/">На главную</a>
        </div>
    </div>
</div>

<footer>© <span id="year"></span> Мой Магазин</footer>

<div class="toast" id="toast">
    <span id="toastMsg">Текст тоста</span>
    <button id="toastClose" class="btn">OK</button>
</div>

<script>
    // --- утилиты / тост ---
    const $ = (sel) => document.querySelector(sel);
    const show = (el, on=true) => el.style.display = on ? '' : 'none';
    const toast = (msg) => {
        const t = $('#toast');
        $('#toastMsg').textContent = msg;
        t.classList.add('show');
        const close = () => t.classList.remove('show');
        $('#toastClose').onclick = close;
        setTimeout(close, 3500);
    };
    const parseJsonSafe = async (res) => {
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) return res.json();
        if (res.status === 204) return null;
        const text = await res.text().catch(() => '');
        try { return text ? JSON.parse(text) : null; } catch { return null; }
    };

    // --- токены ---
    const TOKEN_KEY = 'accessToken';
    const META_KEY  = 'authMeta';
    const getAccessToken = () => sessionStorage.getItem(TOKEN_KEY) || '';
    const setAccessToken  = (t) => t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY);
    const clearAuthStorage = () => { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(META_KEY); };

    // --- authFetch c refresh ---
    async function authFetch(input, init = {}) {
        const headers = new Headers(init.headers || {});
        const token = getAccessToken();
        if (token) headers.set('Authorization', `Bearer ${token}`);
        let res = await fetch(input, { ...init, headers, credentials: 'include' });
        if (res.status === 401 || res.status === 403) {
            const refreshed = await tryRefreshToken();
            if (refreshed) {
                const h2 = new Headers(init.headers || {});
                if (getAccessToken()) h2.set('Authorization', `Bearer ${getAccessToken()}`);
                res = await fetch(input, { ...init, headers: h2, credentials: 'include' });
            }
        }
        return res;
    }
    async function tryRefreshToken() {
        try {
            const r = await fetch('/api/v1/auth/refresh', { method: 'POST', credentials: 'include' });
            if (!r.ok) { setAccessToken(''); return false; }
            const data = await parseJsonSafe(r);
            if (data?.accessToken) { setAccessToken(data.accessToken); return true; }
            setAccessToken(''); return false;
        } catch { setAccessToken(''); return false; }
    }

    // --- состояние ---
    let auth = { isAuth:false, account:null };

    document.addEventListener('DOMContentLoaded', () => {
        $('#year').textContent = new Date().getFullYear();
        wireLogout();
        ensureAuthAndLoad();
    });

    function wireLogout() {
        $('#logoutBtn').addEventListener('click', async () => {
            try { await fetch('/api/v1/auth/logout', { method:'POST', credentials:'include' }); } catch {}
            clearAuthStorage();
            auth = { isAuth:false, account:null };
            renderNav();
            toast('Вы вышли из аккаунта');
            // опционально: редирект гостей на /login
            setTimeout(() => location.href = '/login', 600);
        });
    }

    async function ensureAuthAndLoad() {
        const res = await authFetch('/api/v1/account/me', { method:'GET' });
        if (!res.ok) {
            auth = { isAuth:false, account:null };
            renderNav();
            // если хочешь жёсткий редирект гостей:
            location.href = '/login';
            return;
        }
        const account = await parseJsonSafe(res);
        if (account && (account.username || account.mail || account.companyName)) {
            auth = { isAuth:true, account };
            renderNav();
            renderProfile(account);
        } else {
            auth = { isAuth:false, account:null };
            renderNav();
            location.href = '/login';
        }
    }

    function renderNav() {
        const navPublic = $('#nav-public');
        const navAuth = $('#nav-auth');
        if (auth.isAuth) {
            const name = auth.account?.username || auth.account?.mail || auth.account?.email || auth.account?.companyName || 'account';
            const userBtn = $('#userBtn');
            userBtn.textContent = name;
            userBtn.setAttribute('href', '/account');
            show(navPublic, false);
            show(navAuth, true);
        } else {
            show(navPublic, true);
            show(navAuth, false);
        }
    }

    function initials(s='') {
        const t = String(s).trim();
        if (!t) return '👤';
        const parts = t.split(/\s+/);
        if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function safe(v, fallback='—') {
        if (v === null || v === undefined || v === '') return fallback;
        return String(v);
    }

    function renderProfile(u) {
        const card = $('#profileCard');
        const name = u.username || u.companyName || u.mail || 'account';
        const avatarText = (u.logo && u.logo.trim()) ? '' : initials(name);

        card.innerHTML = `
      <div class="row" style="margin-bottom:14px;">
        <div class="avatar" ${u.logo ? `style="background-image:url('${escapeAttr(u.logo)}');background-size:cover;background-position:center;"` : ''}>
          ${u.logo ? '' : avatarText}
        </div>
        <div>
          <div style="font-size:20px; font-weight:700;">${escapeHtml(name)}</div>
          <div class="muted">${u.isActive ? 'Аккаунт активен' : 'Не активен'}</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="row"><div class="label">Email</div><div class="value">${escapeHtml(safe(u.mail || ''))}</div></div>
        <div class="row"><div class="label">Телефон</div><div class="value">${escapeHtml(safe(u.phone || ''))}</div></div>
        <div class="row"><div class="label">Компания</div><div class="value">${escapeHtml(safe(u.companyName || ''))}</div></div>
        <div class="row"><div class="label">ИНН</div><div class="value">${escapeHtml(safe(u.inn || ''))}</div></div>
        <div class="row"><div class="label">Город</div><div class="value">${escapeHtml(safe(u.city || ''))}</div></div>
        <div class="row"><div class="label">Сайт</div><div class="value">${u.url ? `<a href="${escapeAttr(u.url)}" target="_blank" rel="noopener">${escapeHtml(u.url)}</a>` : '—'}</div></div>
        <div class="row"><div class="label">Правила</div><div class="value">${escapeHtml(safe(u.rules || ''))}</div></div>
        <div class="row"><div class="label">Налог</div><div class="value">${u.tax != null ? Number(u.tax).toFixed(2) : '—'}</div></div>
        <div class="row"><div class="label">Рейтинг</div><div class="value">${u.rating != null ? Number(u.rating).toFixed(2) : '—'}</div></div>
        <div class="row"><div class="label">Статус</div><div class="value">${u.isActive ? 'Активен' : 'Заблокирован'}</div></div>
      </div>

      <div class="actions" style="margin-top:16px;">
        <button class="btn btn-primary" id="editBtn">Редактировать</button>
        <a class="btn btn-outline-dark" href="/">На главную</a>
      </div>
    `;

        $('#editBtn').addEventListener('click', () => {
            toast('Редактирование профиля в разработке');
            // тут позже откроем модал/страницу редактирования
        });
    }

    function escapeHtml(s='') {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(s='') { return escapeHtml(s); }
</script>
</body>
</html>
