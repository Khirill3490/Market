spring:
  application:
    name: product-service

  config:
    import:
      - optional:file:.env.properties
      - optional:file:../common.env.properties

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_inserts: true
        jdbc:
          batch_size: 1000

  flyway:
    enabled: false
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/market}

  file:
    export: exports/products.json

server:
  port: ${SERVER_PORT:0}
  servlet:
    context-path: /api/v1/products

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}