spring:
  application:
    name: auth-module
  config:
    import:
      - optional:file:auth-module/.env.properties
      - optional:file:common.env.properties

  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_inserts: true
        jdbc:
          batch_size: 1000

  flyway:
    enabled: true
    locations: classpath:db/migration


  mail:
    host: smtp.yandex.ru
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.yandex.ru
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/market

app:
  jwt:
    secret: ${JWT_SECRET}
    tokenExpiration: 15m
  reset:
    url: http://127.0.0.1:9090/reset?token={token}
    redis:
      key-prefix: "pwdreset:tok:"
      ttl: 30m

  activation:
    url: http://127.0.0.1:9090/activation?token={token}
#    url: http://127.0.0.1:9090/api/v1/auth/activate?id={id}
    salt: ${SALT_SECRET}
    redis:
      key-prefix: "acct:activate:tok:"
      ttl: 30m

  auth:
    legacy-local-auth-enabled: false
    refresh-ttl: 30d
    key:
      refresh-prefix: "auth:rt:"


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
#eureka:
#  client:
#    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    oauth:
      clientId: market-frontend
      usePkceWithAuthorizationCodeGrant: true
  api-docs:
    path: /v3/api-docs


server:
  port: 8081
