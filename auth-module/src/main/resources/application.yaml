spring:
  application:
    name: auth-module

  config:
    import:
      - optional:file:.env.properties
      - optional:file:../common.env.properties

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_inserts: true
        jdbc:
          batch_size: 1000

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/market}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    oauth:
      clientId: ${SWAGGER_CLIENT_ID:market-frontend}
      usePkceWithAuthorizationCodeGrant: true
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8081}